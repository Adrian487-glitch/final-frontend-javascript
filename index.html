<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width='device-width', initial-scale=1.0" />
    <title>Passord sjekker</title>
    <link rel="stylesheet" href="style.css" />
    <!-- kobler style.css til denne html filen -->
  </head>
  <body>
    <h1>Passord sjekker</h1>
    <!-- overskrift -->
    <div class="container">
      <button onclick="openingModal2()" class="åpen">Test passordet her</button>
      <!-- knapp for å åpne modalen -->
      <p>
        Trykk på knapen og skriv inn et passord for å sjekke hvor bra det er.
        men ikke skriv inn noe sensitivt!
      </p>
      <!--legger inn info boksen-->
      <button id="mørkemodus" onclick="mørkemodus()" class="mørk">
        Mørk modus
      </button>
      <!--lager knappen for å bytte til mørke modus-->
      <button id="lysmodus" onclick="lysmodus()" class="lys">Lys modus</button>
      <!--lager knappen som endrer temaet til lysmodus-->
    </div>
    <div>
      <div id="passordmodal" class="hiddenModal">
        <div class="modalInnhold">
          <input placeholder="Passord" type="password" id="passord" />
          <button class="vis" onclick="visPassord()">vis</button>
          <button
            class="test"
            onclick="
              passordSjekker(document.querySelector('#passord').value, 5)
            "
          >
            Test
          </button>
          <!-- knapp for å teste passordet styrken -->
          <br />
          <meter
            id="passordmeter"
            min="0"
            max="100"
            low="50"
            high="100"
            optimum="50"
          ></meter>
          <!--en meter for å vise om passord lendgen er bra den går fra oransje til grønn-->
          <p style="font-size: 10px; color: white">Lenght meter</p>
          <br />
          <p id="resultat"></p>
          <!--setter inn den teksten i modalen som er rød, oransje eller grønn-->
          <br />
          <button class="lukk" onclick="closingModal2()">Lukk</button>
          <!-- knapp for å lukke modalen -->
        </div>
      </div>
    </div>
    <script src="script.js" defer></script>
    <!-- kobler til script.js til denne html filen -->
  </body>
</html>
