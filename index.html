<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width='device-width', initial-scale=1.0" />
    <title>Passord sjekker</title>
    <link rel="stylesheet" href="style.css" />
    <!-- kobler til style.css -->
  </head>
  <body>
    <h1>Passord sjekker</h1>
    <!-- overskrift -->
    <div class="container">
      <button onclick="openingModal2()" class="åpen">Test passordet her</button>
      <p>
        Trykk på knapen og skriv inn et passord for å sjekke hvor bra det er.
        men ikke skriv inn noe sensitivt!
      </p>
      <button id="mørkemodus" onclick="mørkemodus()" class="mørk">
        Mørk modus
      </button>
      <button id="lysmodus" onclick="lysmodus()" class="lys">Lys modus</button>
    </div>
    <!-- knapp for å åpne modalen -->
    <div>
      <div id="passordmodal" class="hiddenModal">
        <div class="modalInnhold">
          <input placeholder="Passord" type="password" id="passord" />
          <button class="vis" onclick="visPassord()">vis</button>
          <button class="test" onclick="passordSjekker()">Test</button>
          <!-- knapp for å teste passordet -->
          <br />
          <meter id="passordmeter" max="4"></meter>
          <br />
          <p id="resultat"></p>
          <br />
          <button class="lukk" onclick="closingModal2()">Lukk</button>
          <!-- knapp for å lukke modalen -->
        </div>
      </div>
    </div>
    <script src="script.js" defer></script>
    <!-- kobler til script.js -->
  </body>
</html>
